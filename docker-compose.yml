name: pwa-delivery-signatures

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        secret=/run/pwa-secrets/database
        if [ ! -s "$$secret" ]; then
          umask 077
          mkdir -p "$$(dirname "$$secret")"
          head -c 48 /dev/urandom | base64 | tr -d '\n' > "$$secret"
        fi
        export POSTGRES_PASSWORD_FILE="$$secret"
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD_FILE: /run/pwa-secrets/database
      POSTGRES_DB: delivery
    volumes:
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/postgres:/var/lib/postgresql/data
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/secrets:/run/pwa-secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD_FILE: /run/pwa-secrets/database
      DB_USER: delivery
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: delivery
      API_PORT: 8787
      STORAGE_ROOT: /data/storage
      USER_SESSION_HOURS: ${USER_SESSION_HOURS:-12}
      DEVICE_TOKEN_DAYS: ${DEVICE_TOKEN_DAYS:-180}
      DEV_AUTH_BYPASS: "false"
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-}
    volumes:
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/storage:/data/storage
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/secrets:/run/pwa-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8677}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

networks:
  default:
    name: pwa-delivery-signatures
