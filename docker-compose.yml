name: pwa-delivery-signatures

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
    volumes:
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery}:${POSTGRES_PASSWORD:-change-this-db-password}@postgres:5432/${POSTGRES_DB:-delivery}
      API_PORT: 8787
      STORAGE_ROOT: /data/storage
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:-change-this-bootstrap-key}
      USER_SESSION_HOURS: ${USER_SESSION_HOURS:-12}
      DEVICE_TOKEN_DAYS: ${DEVICE_TOKEN_DAYS:-180}
      DEV_AUTH_BYPASS: "false"
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-}
    volumes:
      - ${APP_DATA_DIR:-/DATA/AppData/pwa-delivery-signatures}/storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8677}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

networks:
  default:
    name: pwa-delivery-signatures
