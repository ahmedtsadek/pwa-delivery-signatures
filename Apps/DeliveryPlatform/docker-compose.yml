name: pwa-delivery-signatures

services:
  secret-init:
    image: alpine:3.22
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/pwa-secrets
        if [ ! -s /run/pwa-secrets/database ]; then
          umask 077
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/pwa-secrets/database
        fi
        chmod 600 /run/pwa-secrets/database
        test -s /run/pwa-secrets/database
    volumes:
      - type: bind
        source: /DATA/AppData/com.tee4it.delivery-platform/secrets
        target: /run/pwa-secrets

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD_FILE: /run/pwa-secrets/database
      POSTGRES_DB: delivery
    volumes:
      - type: bind
        source: /DATA/AppData/com.tee4it.delivery-platform/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: /DATA/AppData/com.tee4it.delivery-platform/secrets
        target: /run/pwa-secrets
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/ahmedtsadek/pwa-delivery-signatures-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres:postgres
    environment:
      DB_PASSWORD_FILE: /run/pwa-secrets/database
      DB_USER: delivery
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: delivery
      API_PORT: "8787"
      STORAGE_ROOT: /data/storage
      USER_SESSION_HOURS: "12"
      DEVICE_TOKEN_DAYS: "180"
      DEV_AUTH_BYPASS: "false"
      ROUTER_BASE_URL: ""
      GEOCODER_BASE_URL: ""
      CORS_ORIGINS: ""
    volumes:
      - type: bind
        source: /DATA/AppData/com.tee4it.delivery-platform/storage
        target: /data/storage
      - type: bind
        source: /DATA/AppData/com.tee4it.delivery-platform/secrets
        target: /run/pwa-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/ahmedtsadek/pwa-delivery-signatures-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    links:
      - api:api
    ports:
      - target: 3000
        published: "8677"
        protocol: tcp
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

x-casaos:
  id: com.tee4it.delivery-platform
  main: web
  index: /
  port_map: "8677"
  scheme: http
  icon: ./icon.png
  title:
    en_US: PWA Pharmacy Delivery
  tagline:
    en_US: Smart pharmacy delivery routing, barcode verification and proof of delivery.
  description:
    en_US: >-
      PWA Pharmacy Delivery is a standalone pharmacy delivery platform with a
      dispatcher dashboard, driver PWA, receipt ingestion, route optimization,
      barcode verification, signatures, signed receipts, returns and audit history.
  author: Ahmed T. Sadek
  developer: TEE4IT
  category: Productivity
  architectures:
    - amd64
    - arm64
  version: "1.1.3"
  update_at: "2026-09-29"
  release_notes:
    en_US: Moves database secret creation into a dedicated one-shot initializer container for CasaOS compatibility.
  repo: https://github.com/ahmedtsadek/pwa-delivery-signatures
  docs: https://github.com/ahmedtsadek/pwa-delivery-signatures/blob/main/CASAOS.md
  support: https://github.com/ahmedtsadek/pwa-delivery-signatures/issues
  website: https://delivery.tee4it.com
  tips:
    before_install:
      en_US: >-
        Database credentials are generated automatically on first start. After
        installation, open /setup and create the first pharmacy administrator.
        For production, use HTTPS before real patient data or driver camera features.
