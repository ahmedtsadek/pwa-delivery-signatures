<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PWA Pharmacy Delivery</title>
  <desc id="desc">Pharmacy delivery bag, route and location pin on a blue gradient icon.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset=".48" stop-color="#087CC4"/>
      <stop offset="1" stop-color="#00C7D9"/>
    </linearGradient>
    <linearGradient id="bag" x1="170" y1="175" x2="335" y2="390" gradientUnits="userSpaceOnUse">
