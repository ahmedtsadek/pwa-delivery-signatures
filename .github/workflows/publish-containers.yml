name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "docker/**"
      - ".github/workflows/publish-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/ahmedtsadek/pwa-delivery-signatures-api
  WEB_IMAGE: ghcr.io/ahmedtsadek/pwa-delivery-signatures-web

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
            target_image: ghcr.io/ahmedtsadek/pwa-delivery-signatures-api
          - image: web
            dockerfile: Dockerfile.web
            target_image: ghcr.io/ahmedtsadek/pwa-delivery-signatures-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.target_image }}:latest
            ${{ matrix.target_image }}:1.1.7
          labels: |
            org.opencontainers.image.source=https://github.com/ahmedtsadek/pwa-delivery-signatures
            org.opencontainers.image.version=1.1.7
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
