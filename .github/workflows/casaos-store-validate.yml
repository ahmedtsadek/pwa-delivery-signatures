name: Validate CasaOS App Store

on:
  pull_request:
    paths:
      - "Apps/**"
      - "store-config.json"
      - "supported-languages.json"
      - ".github/workflows/casaos-store-*.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 store
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Verify generated store files
        run: |
          test -f dist/store.json
          test -f dist/index.json
          test -f dist/apps/com.tee4it.delivery-platform/docker-compose.yml
          test -f dist/apps/com.tee4it.delivery-platform/meta.json
