name: Publish CasaOS App Store

on:
  push:
    branches: [main]
    paths:
      - "Apps/**"
      - "store-config.json"
      - "supported-languages.json"
      - ".github/workflows/casaos-store-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 store
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Build legacy CasaOS source zip
        shell: bash
        run: |
          mkdir -p dist/store legacy
          cp -R Apps legacy/Apps
          cp store-config.json supported-languages.json legacy/
          (cd legacy && zip -r ../dist/store/main.zip .)

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy store to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
