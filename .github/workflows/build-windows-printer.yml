name: Build Windows Virtual Printer

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/windows-virtual-printer/**"
      - ".github/workflows/build-windows-printer.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/windows-virtual-printer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DeliveryPrinterInstaller
          delivery_virtual_printer.py

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryPrinterInstaller-windows-x64
          path: tools/windows-virtual-printer/dist/DeliveryPrinterInstaller.exe
          if-no-files-found: error
